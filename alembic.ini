[alembic]
script_location = src/kbmesh/db/migrations
prepend_sys_path = .
# The URL is not stored here: `env.py` reads KBMESH_DB_URL (or KBMESH_TEST_DB_URL under
# KBMESH_ENV=test), and `alembic -x db_url=… upgrade head` overrides it for CI and one-off hosts.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
